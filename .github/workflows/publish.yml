name: Build Expo app

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production, development]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      BUILD_PLATFORM: ${{ inputs.platform || 'android' }}
      BUILD_PROFILE: ${{ inputs.profile || 'production' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Require EAS project configuration
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Configure the EXPO_TOKEN repository secret.' >&2; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo 'Configure the EXPO_PROJECT_ID repository variable.' >&2; exit 1; }
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.12.1
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and publish artifacts to EAS
        run: eas build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --wait --json > eas-builds.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eas-build-results
          path: eas-builds.json
          if-no-files-found: error
