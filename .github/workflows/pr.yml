name: PR

on:
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 https://github.com/actions/checkout/releases/tag/v4.2.2

    - name: Setup Flutter
      uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0 https://github.com/subosito/flutter-action/releases/tag/v2.19.0
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Static Analysis
      run: flutter analyze

    - name: Run Tests
      run: flutter test
